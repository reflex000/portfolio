<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sidharath — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-O5DOrqAk.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-brvOiV8d.css">
  </head>
  <body>
    <div id="app"></div>

    <!-- Handwritten start cue (Bruno style) -->
    <div id="start-cue">
      <svg viewBox="0 0 120 60" width="104" aria-hidden="true">
        <path d="M112 10 C 82 2, 42 10, 16 38" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" />
        <path d="M30 32 L15 39 L31 46" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div>CLICK TO<br />START</div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="badge">
        <strong id="badge-name"></strong>
        <span id="badge-title"></span>
      </div>
      <div id="hint"></div>
      <button id="reset-btn" title="Reset car (R)">↺ Reset</button>
      <div id="popup" class="hidden">
        <h3 id="popup-title"></h3>
        <p id="popup-body"></p>
        <a id="popup-link" target="_blank" rel="noopener"></a>
      </div>
      <div id="joystick" class="hidden">
        <div id="joystick-stick"></div>
      </div>
    </div>

  </body>
</html>
